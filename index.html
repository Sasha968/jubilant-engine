<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>iSpyWithMyLittleEye - Mobile & Desktop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:#000;overflow:hidden;position:relative}
canvas{display:block;width:100%;height:100vh}
#controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none;z-index:10}
.btn{width:80px;height:80px;border-radius:50%;background:rgba(0,255,255,0.3);border:3px solid #0ff;color:#fff;font-size:14px;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(5px);transition:all 0.1s}
.btn:active,.btn.active{background:rgba(0,255,255,0.6);transform:scale(0.95)}
#jumpBtn{margin-right:auto}
#restartBtn{margin-left:auto;background:rgba(255,0,68,0.3);border-color:#f04}
#restartBtn:active{background:rgba(255,0,68,0.6)}
@media(min-width:768px){#controls{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
  <div id="jumpBtn" class="btn">ПРЫЖОК</div>
  <div id="restartBtn" class="btn" style="display:none">РЕСТАРТ</div>
</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
window.addEventListener('resize',resize);
resize();

// Игрок
let player={x:100,y:400,w:40,h:40,vy:0,mode:'cube',rotation:0,onGround:false};
let camera={x:0};

// Уровень
let level={blocks:[],spikes:[],portals:[],finishX:8000};
let boss={x:0,y:300,radius:100,state:'idle',timer:0,color:'#fff',attacks:[]};

// Игровые переменные
let frame=0,gameOver=false,victory=false,started=false;
let inputHeld=false;

// Создание уровня
function createLevel(){
  level.blocks=[];level.spikes=[];level.portals=[];
  const groundY=H-60;let x=400;
  
  // СЕКЦИЯ 1: КУБ
  level.blocks.push({x:x,y:groundY-80,w:120,h:20});x+=200;
  level.spikes.push({x:x,y:groundY-35,w:35,h:35});x+=150;
  level.blocks.push({x:x,y:groundY-120,w:100,h:20});
  level.spikes.push({x:x+30,y:groundY-155,w:35,h:35});x+=250;
  level.spikes.push({x:x,y:groundY-35,w:35,h:35});
  level.spikes.push({x:x+40,y:groundY-35,w:35,h:35});x+=200;
  level.blocks.push({x:x,y:groundY-100,w:80,h:20});x+=180;
  level.blocks.push({x:x,y:groundY-140,w:100,h:20});
  level.spikes.push({x:x+30,y:groundY-175,w:35,h:35});x+=250;
  level.spikes.push({x:x,y:groundY-35,w:35,h:35});
  level.spikes.push({x:x+40,y:groundY-35,w:35,h:35});
  level.spikes.push({x:x+80,y:groundY-35,w:35,h:35});x+=300;
  level.blocks.push({x:x,y:groundY-90,w:150,h:20});x+=250;
  level.portals.push({x:x,y:groundY-200,w:60,h:200,type:'ship'});x+=300;
  
  // СЕКЦИЯ 2: КОРАБЛЬ
  for(let i=0;i<15;i++){
    let topH=Math.random()*100+50;let botH=Math.random()*100+50;
    level.blocks.push({x:x+i*200,y:0,w:40,h:topH});
    level.blocks.push({x:x+i*200,y:groundY-botH,w:40,h:botH});
    if(i%3===0)level.spikes.push({x:x+i*200+100,y:250,w:30,h:30});
  }
  x+=3200;boss.x=x+400;boss.y=H/2;level.finishX=x+1500;
}

// УПРАВЛЕНИЕ - КОМПЬЮТЕР
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();inputHeld=true}
  if(e.code==='KeyR'&&(gameOver||victory))resetGame();
  if((e.code==='Space'||e.code==='ArrowUp')&&!started&&!gameOver&&!victory)started=true;
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='ArrowUp')inputHeld=false;
});
c.addEventListener('mousedown',()=>{inputHeld=true;if(!started&&!gameOver&&!victory)started=true});
c.addEventListener('mouseup',()=>{inputHeld=false});

// УПРАВЛЕНИЕ - ТЕЛЕФОН
const jumpBtn=document.getElementById('jumpBtn');
const restartBtn=document.getElementById('restartBtn');

jumpBtn.addEventListener('touchstart',e=>{
  e.preventDefault();e.stopPropagation();
  inputHeld=true;
  jumpBtn.classList.add('active');
  if(!started&&!gameOver&&!victory)started=true;
});
jumpBtn.addEventListener('touchend',e=>{
  e.preventDefault();e.stopPropagation();
  inputHeld=false;
  jumpBtn.classList.remove('active');
});
jumpBtn.addEventListener('mousedown',e=>{
  e.preventDefault();e.stopPropagation();
  inputHeld=true;
  jumpBtn.classList.add('active');
  if(!started&&!gameOver&&!victory)started=true;
});
jumpBtn.addEventListener('mouseup',e=>{
  e.preventDefault();e.stopPropagation();
  inputHeld=false;
  jumpBtn.classList.remove('active');
});

restartBtn.addEventListener('touchstart',e=>{
  e.preventDefault();e.stopPropagation();
  if(gameOver||victory)resetGame();
});
restartBtn.addEventListener('mousedown',e=>{
  e.preventDefault();e.stopPropagation();
  if(gameOver||victory)resetGame();
});

function resetGame(){
  player={x:100,y:H-200,w:40,h:40,vy:0,mode:'cube',rotation:0,onGround:false};
  camera.x=0;boss={x:boss.x,y:H/2,radius:100,state:'idle',timer:0,color:'#fff',attacks:[]};
  frame=0;gameOver=false;victory=false;
  jumpBtn.style.display='block';restartBtn.style.display='none';
  createLevel();
}

function update(){
  if(!started||gameOver||victory)return;
  frame++;
  const groundY=H-60;
  
  // Физика
  if(player.mode==='cube'){
    player.vy+=0.75;
    if(inputHeld&&player.onGround){player.vy=-14;player.onGround=false}
    player.rotation+=player.onGround?0:6;
  }else if(player.mode==='ship'){
    player.vy+=inputHeld?-0.8:0.5;
    player.vy=Math.max(-8,Math.min(8,player.vy));
    player.rotation=player.vy*4;
  }
  
  player.y+=player.vy;player.x+=7;
  
  if(player.y+player.h>groundY){
    player.y=groundY-player.h;player.vy=0;player.onGround=true;
    if(player.mode==='cube')player.rotation=Math.round(player.rotation/90)*90;
  }else if(player.y<0){player.y=0;player.vy=0}
  else player.onGround=false;
  
  // Столкновения
  level.blocks.forEach(b=>{
    if(player.x<b.x+b.w&&player.x+player.w>b.x&&player.y+player.h>b.y&&player.y<b.y+b.h){
      const overlapX=Math.min(player.x+player.w-b.x,b.x+b.w-player.x);
      const overlapY=Math.min(player.y+player.h-b.y,b.y+b.h-player.y);
      if(overlapX<overlapY)player.x-=overlapX*(player.x<b.x+b.w/2?1:-1);
      else{player.y-=overlapY*(player.y<b.y+b.h/2?1:-1);player.vy=0;player.onGround=true}
    }
  });
  
  level.spikes.forEach(s=>{
    if(player.x<s.x+s.w&&player.x+player.w>s.x&&player.y<s.y+s.h&&player.y+player.h>s.y)gameOver=true;
  });
  
  level.portals.forEach(p=>{
    if(player.x<p.x+p.w&&player.x+player.w>p.x&&player.y<p.y+p.h&&player.y+player.h>p.y){
      player.mode=p.type;if(p.type==='ship')player.y=H/2;
    }
  });
  
  camera.x=player.x-W*0.3;
  
  if(player.x>level.finishX-2000)updateBoss();
  if(player.x>level.finishX)victory=true;
  
  // Показать кнопку рестарта
  if((gameOver||victory)&&window.innerWidth<768)restartBtn.style.display='flex';
}

function updateBoss(){
  boss.timer++;
  if(boss.state==='idle'&&boss.timer>120){boss.state='warning';boss.timer=0}
  else if(boss.state==='warning'&&boss.timer>40){
    boss.state='attack';boss.timer=0;
    let roll=Math.random();
    if(roll<0.4)boss.attacks.push({type:'laser',x:boss.x-1000,y:boss.y-20,w:2000,h:40,life:50});
    else if(roll<0.7){for(let i=0;i<5;i++)boss.attacks.push({type:'spike',x:boss.x+200+i*100,y:Math.random()*400+100,w:40,h:40,vx:-10})}
    else boss.attacks.push({type:'charge',x:boss.x,y:boss.y,w:150,h:150,vx:-20});
  }else if(boss.state==='attack'&&boss.timer>70){boss.state='idle';boss.timer=0}
  
  if(boss.state==='idle')boss.color='#fff';
  else if(boss.state==='warning')boss.color='#fa0';
  else if(boss.state==='attack')boss.color='#f00';
  
  for(let i=boss.attacks.length-1;i>=0;i--){
    let a=boss.attacks[i];
    if(a.vx)a.x+=a.vx;
    if(a.life!==undefined){a.life--;if(a.life<=0)boss.attacks.splice(i,1)}
    else if(a.x<camera.x-200)boss.attacks.splice(i,1);
    if(player.x<a.x+a.w&&player.x+player.w>a.x&&player.y<a.y+a.h&&player.y+player.h>a.y)gameOver=true;
  }
}

function draw(){
  let bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0514');bg.addColorStop(1,'#1a0a2e');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  
  ctx.save();ctx.translate(-camera.x,0);
  
  ctx.strokeStyle='rgba(0,255,255,0.05)';ctx.lineWidth=1;
  for(let i=Math.floor(camera.x/60)*60;i<camera.x+W+60;i+=60){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
  for(let i=0;i<H;i+=60){ctx.beginPath();ctx.moveTo(camera.x,i);ctx.lineTo(camera.x+W,i);ctx.stroke()}
  
  const groundY=H-60;
  ctx.fillStyle='#111122';ctx.fillRect(camera.x,groundY,W,60);
  ctx.strokeStyle='#0ff';ctx.lineWidth=3;ctx.shadowBlur=10;ctx.shadowColor='#0ff';
  ctx.beginPath();ctx.moveTo(camera.x,groundY);ctx.lineTo(camera.x+W,groundY);ctx.stroke();
  ctx.shadowBlur=0;
  
  level.blocks.forEach(b=>{ctx.fillStyle='#222';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#0ff';ctx.lineWidth=2;ctx.strokeRect(b.x,b.y,b.w,b.h)});
  level.spikes.forEach(s=>{ctx.fillStyle='#f04';ctx.beginPath();ctx.moveTo(s.x,s.y+s.h);ctx.lineTo(s.x+s.w/2,s.y);ctx.lineTo(s.x+s.w,s.y+s.h);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()});
  level.portals.forEach(p=>{ctx.fillStyle='rgba(0,255,255,0.3)';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeStyle='#0ff';ctx.lineWidth=3;ctx.strokeRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#0ff';ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.fillText('SHIP',p.x+p.w/2,p.y+p.h/2)});
  
  boss.attacks.forEach(a=>{
    if(a.type==='laser'){ctx.fillStyle=`rgba(255,0,0,${a.life/50})`;ctx.shadowBlur=20;ctx.shadowColor='#f00';ctx.fillRect(a.x,a.y,a.w,a.h);ctx.shadowBlur=0}
    else if(a.type==='spike'){ctx.fillStyle='#f04';ctx.beginPath();ctx.moveTo(a.x,a.y+a.h);ctx.lineTo(a.x+a.w/2,a.y);ctx.lineTo(a.x+a.w,a.y+a.h);ctx.fill()}
    else if(a.type==='charge'){ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(a.x+a.w/2,a.y+a.h/2,a.w/2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke()}
  });
  
  if(player.x>level.finishX-2000)drawBoss();
  drawPlayer();
  
  ctx.fillStyle='#0f0';ctx.fillRect(level.finishX,0,20,H);
  ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.fillText('FINISH',level.finishX+10,100);
  ctx.restore();
  
  ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='left';
  let progress=Math.floor((player.x/level.finishX)*100);
  ctx.fillText(`Прогресс: ${Math.min(progress,100)}%`,20,40);
  
  if(!started){
    ctx.fillStyle='rgba(0,0,0,0.9)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0ff';ctx.font='bold 72px Arial';ctx.textAlign='center';
    ctx.fillText('iSpyWithMyLittleEye',W/2,H/2-20);
    ctx.font='28px Arial';ctx.fillStyle='#fff';
    ctx.fillText('Нажми ПРОБЕЛ или кнопку ПРЫЖОК',W/2,H/2+40);
  }
  
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.9)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f00';ctx.font='bold 80px Arial';ctx.textAlign='center';
    ctx.fillText('ПОЙМАН!',W/2,H/2-20);
    ctx.fillStyle='#fff';ctx.font='28px Arial';
    ctx.fillText('Нажми R или кнопку РЕСТАРТ',W/2,H/2+40);
  }
  
  if(victory){
    ctx.fillStyle='rgba(0,0,0,0.9)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0f0';ctx.font='bold 80px Arial';ctx.textAlign='center';
    ctx.fillText('УРОВЕНЬ ПРОЙДЕН!',W/2,H/2-20);
  }
}

function drawPlayer(){
  ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h/2);ctx.rotate(player.rotation*Math.PI/180);
  ctx.shadowBlur=15;ctx.shadowColor='#0ff';
  if(player.mode==='cube'){
    ctx.fillStyle='#0ff';ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h);
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(-player.w/2,-player.h/2,player.w,player.h);
    ctx.fillStyle='#000';ctx.fillRect(6,-10,12,12);ctx.fillStyle='#fff';ctx.fillRect(9,-8,5,5);
  }else if(player.mode==='ship'){
    ctx.fillStyle='#0ff';ctx.beginPath();ctx.moveTo(-20,-15);ctx.lineTo(25,0);ctx.lineTo(-20,15);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,0,6,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();ctx.shadowBlur=0;
}

function drawBoss(){
  let bx=boss.x,by=boss.y,r=boss.radius;
  let glow=ctx.createRadialGradient(bx,by,0,bx,by,r*2.5);
  glow.addColorStop(0,boss.color+'60');glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;ctx.fillRect(bx-r*3,by-r*3,r*6,r*6);
  ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.fillStyle=boss.color;ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=6;ctx.stroke();
  let dx=player.x-bx,dy=player.y-by,dist=Math.sqrt(dx*dx+dy*dy)||1;
  let px=bx+(dx/dist)*30,py=by+(dy/dist)*30;
  ctx.beginPath();ctx.arc(px,py,35,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();
  ctx.beginPath();ctx.arc(px-12,py-12,12,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  if(boss.state!=='idle'){
    ctx.beginPath();ctx.arc(bx,by,r+20,0,Math.PI*2);ctx.strokeStyle=boss.color;ctx.lineWidth=4;
    ctx.setLineDash([15,10]);ctx.lineDashOffset=-frame*5;ctx.stroke();ctx.setLineDash([]);
  }
}

function loop(){update();draw();requestAnimationFrame(loop)}
createLevel();loop();
</script>
</body>
</html>
